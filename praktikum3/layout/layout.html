<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>

    <!-- CSS -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: aquamarine;
            padding: 10px
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 10px;
        }

        header {
            background-color: yellow;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            border: 1px solid;
        }
        nav {
            background-color: #76ff03;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 1px solid #e0e0e0;
        }

        .main-content {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        article {
            flex: 3;
            background-color: #ffe082;
            padding: 15px;
            border: 1px solid #ffd54f;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        section {
            background-color: #ffe57f;
            padding: 15px;
            border: 1px solid #ffca28;
            flex: 1;
            display: flex;
            align-items: center;
        }

        aside {
            flex: 1;
            background-color: #00bcd4;
            padding: 15px;
            border: 1px solid #00acc1;
            color: #000;
        }

        footer {
            background-color: #ffeb3b;
            padding: 20px;
            text-align: left;
            font-weight: bold;
            border: 1px solid #e0e0e0;
        }
        
        
    </style>
    
</head>
<body>

    <div class="wrapper" >
        <!-- Header -->
        <header>
           <img src="../layout/logo/logo.png" alt="Logo" width="100px">
           <p>Ini Webku</p>
        </header>

        <!-- Navbar -->
        <nav>
          Nav
        </nav>

        <!-- Sidebar & Content -->
        <div class="main-content">
            <article>
                <section>Praktikum 1</section>
                <section>Praktikum 2</section>
                <section>Praktikum 3</section>
            </article>

            <aside>
                Ini Sidebar
            </aside>
        </div>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 Praktikum Desain UI/UX Pemrograman Web</p>
        </footer>

    </div>

</body>
</html>
