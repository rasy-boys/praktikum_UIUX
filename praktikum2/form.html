<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Goose Bistro | Pizza-on-Demand</title>
</head>
<body>

    <h1>Black Goose Bistro | Pizza-on-Demand</h1>

    <p>
        Our 12&quot; wood-fired pizzas are available for delivery.
        Build your custom pizza and we'll deliver it within an hour.
    </p>

    <form action="http://blackgoosebistro.com/pizza.php" method="post">

        <fieldset>
            <legend>Your Information</legend>

            <p>
                <label for="customername">Name:</label>
                <input type="text" id="customername" name="customername" required>
            </p>

            <p>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
            </p>

            <p>
                <label for="telephone">Telephone Number:</label>
                <input type="tel" id="telephone" name="telephone" required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="instructions">Delivery instructions:</label>
                <br>
                <textarea
                    id="instructions"
                    name="instructions"
                    rows="4"
                    cols="50"
                    maxlength="400"
                    placeholder="No more than 400 characters long"></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Design Your Dream Pizza</legend>

            <h3>Pizza specs</h3>

            <p>Crust (Choose one):</p>

            <input type="radio" id="classic" name="crust" value="classic white" required>
            <label for="classic">Classic white</label>
            <br>

            <input type="radio" id="multigrain" name="crust" value="multigrain">
            <label for="multigrain">Multigrain</label>
            <br>

            <input type="radio" id="cheese" name="crust" value="cheese-stuffed">
            <label for="cheese">Cheese-stuffed crust</label>
            <br>

            <input type="radio" id="gluten-free" name="crust" value="gluten-free">
            <label for="gluten-free">Gluten-free</label>

            <p>Toppings (Choose as many as you want):</p>

            <input type="checkbox" id="redsauce" name="toppings[]" value="red sauce" checked>
            <label for="redsauce">Red sauce</label>
            <br>

            <input type="checkbox" id="whitesauce" name="toppings[]" value="white sauce">
            <label for="whitesauce">White sauce</label>
            <br>

            <input type="checkbox" id="mozzarella" name="toppings[]" value="mozzarella cheese">
            <label for="mozzarella">Mozzarella Cheese</label>
            <br>

            <input type="checkbox" id="pepperoni" name="toppings[]" value="pepperoni">
            <label for="pepperoni">Pepperoni</label>
            <br>

            <input type="checkbox" id="mushrooms" name="toppings[]" value="mushrooms">
            <label for="mushrooms">Mushrooms</label>
            <br>

            <input type="checkbox" id="peppers" name="toppings[]" value="peppers">
            <label for="peppers">Peppers</label>
            <br>

            <input type="checkbox" id="anchovies" name="toppings[]" value="anchovies">
            <label for="anchovies">Anchovies</label>

            <h3>Number</h3>
            <p>
                <label for="number">How many pizzas:</label>
                <select id="number" name="number">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Bring me a pizza!">
            <input type="reset" value="Reset">
        </p>

    </form>

</body>
</html>
